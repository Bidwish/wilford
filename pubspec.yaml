name: wilford
description: "A new Flutter project."
publish_to: 'none' 

version: 1.0.10+10

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  dotted_line: ^3.0.0
  localstorage: ^6.0.0

  # Utility Package
  http: ^1.3.0
  intl: ^0.20.2
  logger: ^2.5.0
  lottie: ^3.3.1
  shimmer: ^3.0.0
  url_launcher: ^6.3.1
  image_picker: ^1.0.4
  share_plus: ^12.0.0
  path_provider: ^2.1.5
  screenshot: ^3.0.0
  pdf: ^3.11.3
  printing: ^5.14.2
  permission_handler: ^12.0.1
  google_fonts: ^6.3.2
  pin_code_fields: ^8.0.0
  connectivity_plus: ^7.0.0
  supabase_flutter: ^2.10.3
  firebase_core: ^4.2.0
  firebase_messaging: ^16.0.3
  flutter_local_notifications: ^17.1.2
  flutter_native_contact_picker: ^0.0.10
  flutter_native_splash: ^2.4.4
  smooth_page_indicator: ^1.2.0+3

  #Icons
  iconsax: ^0.0.8
  #cupertino_icons: ^1.0.8

  # State Management
  get: ^4.6.5
  get_storage: ^2.1.1

dev_dependencies:
  change_app_package_name: ^1.5.0
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logos/logo.png"

flutter:
  uses-material-design: true

  #--------------- LOCAL ASSETS ------------------#
  assets:
    - assets/logos/
    - assets/icons/
    - assets/animations/
    - assets/images/cable/
    - assets/images/network/
    - assets/images/exam/
    - assets/images/content/
    - assets/images/gift_card/
    - assets/images/animations/   
    - assets/images/on_boarding_images/

  #--------------- LOCAL FONTS ------------------#
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Italic.ttf
          style: italic
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 800